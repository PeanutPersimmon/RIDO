<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#e6f4f0">
  <title>骑行的鹈鹕 · SVG 动画</title>
  <style>
    :root {
      color-scheme: light;
      font-family: "Trebuchet MS", "Microsoft YaHei", system-ui, sans-serif;
      --ink: #243d4a;
      --cycle: 1.7s;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background: radial-gradient(circle at 20% 10%, #fffdf6 0, #e6f4f0 55%, #d3ece8 100%);
      color: var(--ink);
    }
    main { width: min(100%, 1060px); }
    .heading { display: flex; align-items: end; justify-content: space-between; gap: 20px; margin: 0 5px 18px; }
    h1 { margin: 0; font-size: clamp(1.6rem, 4vw, 2.7rem); letter-spacing: .05em; }
    .sub { margin: 5px 0 0; color: #58717a; font-size: .96rem; }
    .card { overflow: hidden; border: 2px solid #fff; border-radius: 28px; background: #bfe6e9; box-shadow: 0 20px 60px #3b767325, 0 2px 8px #416d6d18; }
    svg { display: block; width: 100%; height: auto; }
    .controls { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 22px; padding: 16px 5px 0; }
    button { border: 0; border-radius: 100px; padding: 10px 20px; background: #234752; color: white; font: inherit; font-weight: 700; cursor: pointer; box-shadow: 0 4px 0 #14313a; }
    button:hover { background: #315f69; }
    button:active { transform: translateY(2px); box-shadow: 0 2px 0 #14313a; }
    button:focus-visible, input:focus-visible { outline: 3px solid #e59e51; outline-offset: 3px; }
    label { display: flex; align-items: center; gap: 12px; font-size: .95rem; }
    input[type="range"] { width: 150px; accent-color: #dd7651; }
    .hint { margin-left: auto; color: #668089; font-size: .82rem; }

    .cloud-a { animation: cloud-drift 15s linear infinite alternate; }
    .cloud-b { animation: cloud-drift 21s linear infinite alternate-reverse; }
    .road-mark { animation: road-drift var(--cycle) linear infinite; }
    .wheel-spin { animation: spin var(--cycle) linear infinite; }
    .wheel-spin.rear { transform-origin: 300px 490px; }
    .wheel-spin.front { transform-origin: 695px 490px; }
    .crank { transform-origin: 500px 505px; animation: spin var(--cycle) linear infinite; }
    .rider { animation: bob calc(var(--cycle) / 2) ease-in-out infinite alternate; }
    .wing { transform-origin: 430px 260px; animation: wing-sway calc(var(--cycle) / 2) ease-in-out infinite alternate; }
    .scarf-tail { transform-origin: 535px 180px; animation: scarf-wave .7s ease-in-out infinite alternate; }
    .paused *, .paused *::before, .paused *::after { animation-play-state: paused !important; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes bob { to { transform: translateY(5px); } }
    @keyframes wing-sway { to { transform: rotate(-4deg); } }
    @keyframes scarf-wave { to { transform: rotate(-9deg); } }
    @keyframes cloud-drift { to { transform: translateX(70px); } }
    @keyframes road-drift { to { transform: translateX(-120px); } }
    @media (prefers-reduced-motion: reduce) {
      svg *, svg *::before, svg *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; }
    }
    @media (max-width: 600px) { .hint { width: 100%; margin-left: 0; } }
  </style>
</head>
<body>
  <main>
    <div class="heading">
      <div>
        <h1>骑行的鹈鹕</h1>
        <p class="sub">一段用 SVG 画出来的海边小旅行</p>
      </div>
    </div>
    <div class="card">
      <svg id="scene" viewBox="0 0 1000 650" role="img" aria-labelledby="scene-title scene-desc" xmlns="http://www.w3.org/2000/svg">
        <title id="scene-title">鹈鹕骑自行车</title>
        <desc id="scene-desc">一只戴着蓝色围巾的鹈鹕沿海边公路骑着红色自行车；车轮和脚踏转动，白云与路面缓缓移动。</desc>
        <defs>
          <linearGradient id="sky" x2="0" y2="1"><stop stop-color="#a8dce9"/><stop offset="1" stop-color="#e2f3e7"/></linearGradient>
          <linearGradient id="sea" x2="0" y2="1"><stop stop-color="#67bbbe"/><stop offset="1" stop-color="#4ca4aa"/></linearGradient>
          <linearGradient id="pouch" x2="0" y2="1"><stop stop-color="#f5b979"/><stop offset="1" stop-color="#e78260"/></linearGradient>
          <g id="cloud" fill="#fffdf3" opacity=".92">
            <ellipse cx="0" cy="0" rx="52" ry="19"/><circle cx="-24" cy="-12" r="22"/><circle cx="8" cy="-23" r="31"/><circle cx="38" cy="-9" r="23"/>
          </g>
          <g id="flower"><path d="M0 0V-16" stroke="#579d70" stroke-width="3" stroke-linecap="round"/><circle cx="0" cy="-21" r="5" fill="#e9ac75"/><circle cx="-7" cy="-21" r="5" fill="#fff5d4"/><circle cx="7" cy="-21" r="5" fill="#fff5d4"/><circle cx="0" cy="-28" r="5" fill="#fff5d4"/><circle cx="0" cy="-14" r="5" fill="#fff5d4"/></g>
        </defs>

        <!-- Seaside landscape -->
        <path fill="url(#sky)" d="M0 0h1000v650H0z"/>
        <circle cx="817" cy="115" r="49" fill="#fff6c8" opacity=".82"/>
        <circle cx="817" cy="115" r="69" fill="none" stroke="#fff6c8" stroke-width="2" opacity=".55"/>
        <use href="#cloud" x="169" y="104" class="cloud-a"/>
        <use href="#cloud" x="617" y="65" class="cloud-b" transform="scale(.67)"/>
        <use href="#cloud" x="894" y="194" class="cloud-a" transform="scale(.48)"/>
        <path fill="#9ad2c8" d="M0 302 Q95 275 191 305 T393 305 T598 301 T807 304 T1000 297 V435H0Z"/>
        <path fill="url(#sea)" d="M0 334 Q245 330 494 337 T1000 334 V437H0Z"/>
        <g fill="none" stroke="#dcf8ed" stroke-width="3" opacity=".65" stroke-linecap="round">
          <path d="M68 364h98m121 28h78m169-27h112m91 22h78m85-34h68"/>
          <path d="M9 414h59m136-6h113m143 3h91m178-8h104"/>
        </g>
        <path fill="#ebdba7" d="M0 428 Q232 414 500 432 T1000 426 V524H0Z"/>
        <g fill="#75ae79" opacity=".85"><path d="M0 435Q77 419 156 438T336 436T509 441T679 431T844 437T1000 430v64H0Z"/></g>
        <use href="#flower" x="109" y="471"/><use href="#flower" x="166" y="485" transform="rotate(-11 166 485)"/>
        <use href="#flower" x="835" y="481"/><use href="#flower" x="904" y="466" transform="rotate(10 904 466)"/>
        <path fill="#d5c89d" d="M0 494H1000v34H0z"/>
        <path fill="#e7c796" d="M0 528H1000v122H0z"/>
        <path d="M0 530H1000" stroke="#c6ad80" stroke-width="5"/>
        <g class="road-mark" fill="#fff5d9" opacity=".72">
          <rect x="-80" y="592" width="75" height="6" rx="3"/><rect x="40" y="592" width="75" height="6" rx="3"/>
          <rect x="160" y="592" width="75" height="6" rx="3"/><rect x="280" y="592" width="75" height="6" rx="3"/>
          <rect x="400" y="592" width="75" height="6" rx="3"/><rect x="520" y="592" width="75" height="6" rx="3"/>
          <rect x="640" y="592" width="75" height="6" rx="3"/><rect x="760" y="592" width="75" height="6" rx="3"/>
          <rect x="880" y="592" width="75" height="6" rx="3"/><rect x="1000" y="592" width="75" height="6" rx="3"/>
        </g>

        <!-- Bicycle wheels: stationary tires, rotating spokes -->
        <ellipse cx="500" cy="591" rx="325" ry="16" fill="#7c725c" opacity=".15"/>
        <g fill="none" stroke="#263f49">
          <circle cx="300" cy="490" r="97" stroke-width="12"/><circle cx="695" cy="490" r="97" stroke-width="12"/>
          <circle cx="300" cy="490" r="83" stroke="#f7f0d8" stroke-width="4"/><circle cx="695" cy="490" r="83" stroke="#f7f0d8" stroke-width="4"/>
        </g>
        <g class="wheel-spin rear" stroke="#f5f2e8" stroke-width="2.5" opacity=".82">
          <path d="M300 407v166M217 490h166M241.3 431.3l117.4 117.4m0-117.4L241.3 548.7M268.2 413.3l63.6 153.4m-108.5-44.9 153.4-63.6m-153.4 0 153.4 63.6m-108.5 44.9 63.6-153.4"/>
        </g>
        <g class="wheel-spin front" stroke="#f5f2e8" stroke-width="2.5" opacity=".82">
          <path d="M695 407v166M612 490h166M636.3 431.3l117.4 117.4m0-117.4L636.3 548.7M663.2 413.3l63.6 153.4m-108.5-44.9 153.4-63.6m-153.4 0 153.4 63.6m-108.5 44.9 63.6-153.4"/>
        </g>

        <!-- Bicycle frame -->
        <g fill="none" stroke-linecap="round" stroke-linejoin="round">
          <path d="M300 490 449 358 500 505 300 490 M449 358 630 362 500 505" stroke="#31535a" stroke-width="16"/>
          <path d="M300 490 449 358 500 505 300 490 M449 358 630 362 500 505" stroke="#e76954" stroke-width="11"/>
          <path d="M630 362 695 490M625 350 648 311" stroke="#31535a" stroke-width="15"/>
          <path d="M630 362 695 490M625 350 648 311" stroke="#e76954" stroke-width="10"/>
          <path d="M648 311q14-8 27 3h27" stroke="#31535a" stroke-width="11"/>
          <path d="M438 357 429 330" stroke="#31535a" stroke-width="9"/>
          <path d="M405 332q35-11 82-1" stroke="#314d52" stroke-width="13"/>
          <path d="M682 313h23" stroke="#29464b" stroke-width="15"/>
          <circle cx="500" cy="505" r="19" fill="#f5dfad" stroke="#31535a" stroke-width="8"/>
          <circle cx="300" cy="490" r="10" fill="#f5dfad" stroke="#31535a" stroke-width="7"/>
          <circle cx="695" cy="490" r="10" fill="#f5dfad" stroke="#31535a" stroke-width="7"/>
        </g>

        <!-- Far leg and rotating crank -->
        <g class="rider" fill="none" stroke-linecap="round" stroke-linejoin="round">
          <path d="M465 304 Q441 361 451 406 L460 505" stroke="#d18048" stroke-width="17">
            <animate attributeName="d" dur="1.7s" repeatCount="indefinite" values="M465 304 Q441 361 451 406 L460 505;M465 304 Q440 371 450 418 L500 465;M465 304 Q443 379 457 432 L540 505;M465 304 Q453 388 477 451 L500 545;M465 304 Q441 361 451 406 L460 505"/>
          </path>
        </g>
        <g class="crank" stroke="#314b50" stroke-width="8" stroke-linecap="round">
          <path d="M460 505h80"/>
          <path d="M443 505h32M525 505h32" stroke-width="10"/>
        </g>

        <!-- Pelican -->
        <g class="rider">
          <!-- Tail and body -->
          <path d="M374 286q-45 4-75-23 5 41 56 54" fill="#f6eee0" stroke="#304d54" stroke-width="5" stroke-linejoin="round"/>
          <path d="M363 271q-46-11-65-42 0 34 53 68" fill="#fff9e9" stroke="#304d54" stroke-width="5" stroke-linejoin="round"/>
          <ellipse cx="444" cy="270" rx="111" ry="78" fill="#fffaf0" stroke="#304d54" stroke-width="6"/>
          <path class="wing" d="M356 263q42-62 119-36 35 17 35 56-40 45-107 31-36-6-47-51Z" fill="#f2e9d8" stroke="#304d54" stroke-width="5"/>
          <path d="M378 281q51 27 98-4" fill="none" stroke="#d6cbbb" stroke-width="4" stroke-linecap="round"/>
          <!-- Neck and head -->
          <path d="M506 253 Q522 199 534 146 Q546 102 587 100 Q615 103 623 128 Q584 130 579 174 Q565 232 533 279Z" fill="#fffaf0" stroke="#304d54" stroke-width="6" stroke-linejoin="round"/>
          <ellipse cx="603" cy="128" rx="55" ry="43" fill="#fffaf0" stroke="#304d54" stroke-width="6"/>
          <path d="M569 91q2-26 16-34-3 25 8 28m4-2q8-26 22-30-9 25-6 32" fill="#fffaf0" stroke="#304d54" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
          <!-- Scarf -->
          <path d="M539 171q20 24 52 11" fill="none" stroke="#397d9c" stroke-width="16" stroke-linecap="round"/>
          <path class="scarf-tail" d="M540 179 Q512 181 504 205 Q520 191 544 198Z" fill="#438fae" stroke="#315e70" stroke-width="3"/>
          <!-- Eye -->
          <circle cx="619" cy="118" r="6.8" fill="#2d4145"/><circle cx="621" cy="115" r="2" fill="white"/>
          <path d="M603 104q12-7 24-2" fill="none" stroke="#31494c" stroke-width="3" stroke-linecap="round"/>
          <!-- Orange throat pouch and long bill -->
          <path d="M639 164 Q650 223 698 239 Q748 248 781 181 Q736 203 640 172Z" fill="url(#pouch)" stroke="#684c3c" stroke-width="4" stroke-linejoin="round"/>
          <path d="M636 154 Q697 153 790 174 Q800 177 790 184 Q722 183 637 174Z" fill="#f8b35e" stroke="#684c3c" stroke-width="4" stroke-linejoin="round"/>
          <path d="M658 163 Q720 168 776 177" fill="none" stroke="#ffe2a3" stroke-width="3" stroke-linecap="round"/>
          <path d="M782 175q10-3 13 4" fill="none" stroke="#684c3c" stroke-width="3" stroke-linecap="round"/>
          <!-- Foreleg (pedaling) -->
          <path d="M472 307 Q496 360 513 404 L540 505" fill="none" stroke="#e89c59" stroke-width="19" stroke-linecap="round" stroke-linejoin="round">
            <animate attributeName="d" dur="1.7s" repeatCount="indefinite" values="M472 307 Q496 360 513 404 L540 505;M472 307 Q503 370 518 413 L500 545;M472 307 Q503 380 505 425 L460 505;M472 307 Q492 371 499 403 L500 465;M472 307 Q496 360 513 404 L540 505"/>
          </path>
          <!-- Wingtip on handlebar -->
          <path d="M482 267 Q543 277 593 300 L669 318" fill="none" stroke="#304d54" stroke-width="27" stroke-linecap="round"/>
          <path d="M482 267 Q543 277 593 300 L669 318" fill="none" stroke="#fff8e9" stroke-width="20" stroke-linecap="round"/>
          <path d="M666 317q11-2 18 4" fill="none" stroke="#f6e8d2" stroke-width="14" stroke-linecap="round"/>
        </g>

        <!-- Little motion accents -->
        <g fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity=".75">
          <path d="M108 292h45m-25 16h36M77 309h24"/>
          <path d="M832 275h45m-24 17h32"/>
        </g>
      </svg>
    </div>
    <div class="controls">
      <button id="toggle" type="button" aria-pressed="false">暂停动画</button>
      <label for="speed">骑行速度 <input id="speed" type="range" min="0.5" max="2.5" value="1" step="0.1" aria-label="骑行速度"></label>
      <span class="hint">拖动滑块调整节奏 · 单文件，无需联网</span>
    </div>
  </main>
  <script>
    const scene = document.getElementById('scene');
    const toggle = document.getElementById('toggle');
    const speed = document.getElementById('speed');
    const legAnimations = scene.querySelectorAll('animate[attributeName="d"]');

    toggle.addEventListener('click', () => {
      const paused = scene.classList.toggle('paused');
      if (paused) scene.pauseAnimations();
      else scene.unpauseAnimations();
      toggle.textContent = paused ? '继续动画' : '暂停动画';
      toggle.setAttribute('aria-pressed', String(paused));
    });

    speed.addEventListener('input', () => {
      const duration = `${(1.7 / Number(speed.value)).toFixed(2)}s`;
      document.documentElement.style.setProperty('--cycle', duration);
      legAnimations.forEach(animation => animation.setAttribute('dur', duration));
    });

    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
      scene.classList.add('paused');
      scene.pauseAnimations();
      toggle.textContent = '继续动画';
      toggle.setAttribute('aria-pressed', 'true');
    }
  </script>
</body>
</html>
